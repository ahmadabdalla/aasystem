name: Publish release

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_pr:
        description: Merged release PR number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.title, 'release: v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Resolve merged release PR
        id: release
        env:
          RELEASE_PR: ${{ github.event.pull_request.number || inputs.release_pr }}
        run: |
          [[ "$RELEASE_PR" =~ ^[1-9][0-9]*$ ]] || exit 1
          pr=$(gh api "repos/$GH_REPO/pulls/$RELEASE_PR")
          jq -e --arg repo "$GH_REPO" '.merged == true and .base.ref == "main" and .base.repo.full_name == $repo' <<< "$pr" > /dev/null
          sha=$(jq -r '.merge_commit_sha' <<< "$pr")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          title=$(jq -r '.title' <<< "$pr")
          [[ "$title" =~ ^release:\ v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=${title#release: v}" >> "$GITHUB_OUTPUT"
          echo "pr_url=https://github.com/$GH_REPO/pull/$RELEASE_PR" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Install development dependencies
        run: |
          # Pre-migration release commits have no Python development requirements.
          if [[ -f requirements-dev.txt ]]; then
            python3 -m pip install -r requirements-dev.txt
          fi
      - name: Test the merged commit
        run: python3 -m unittest discover -s tests
      - name: Validate and publish the exact commit
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_PR_URL: ${{ steps.release.outputs.pr_url }}
        run: bash scripts/publish-release.sh "$VERSION" "$RELEASE_SHA" "$RELEASE_PR_URL"
