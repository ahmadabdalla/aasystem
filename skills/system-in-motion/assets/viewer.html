<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Project walkthrough</title>
    <style>
      #system-in-motion {
        color-scheme: light;
        --em-page: light-dark(#ffffff, #0b1526);
        --em-panel: light-dark(#ffffff, #162139);
        --em-soft: light-dark(#f1f5f9, #202d43);
        --em-ink: light-dark(#162544, #f4f2ee);
        --em-muted: light-dark(#526176, #b3bed0);
        --em-line: light-dark(#d9dce1, #39465d);
        --em-wire: light-dark(#64748b, #b3bed0);
        --em-accent: #1d4ed8;
        --em-accent-ink: light-dark(#1d4ed8, #93c5fd);
        --em-accent-soft: light-dark(#eff6ff, #1e3a5f);
        --em-good: light-dark(#23684c, #9bd4b8);
        --em-good-bg: light-dark(#e7f2ec, #1e3b34);
        --em-action: light-dark(#162544, #d9e2f3);
        --em-action-ink: light-dark(#ffffff, #162544);
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: var(--em-ink);
        width: 100%;
        isolation: isolate;
      }
      #system-in-motion * {
        box-sizing: border-box;
      }
      #system-in-motion button {
        font: inherit;
      }
      #system-in-motion button:disabled {
        cursor: default;
        opacity: 0.42;
      }
      #system-in-motion [role='button']:focus-visible,
      #system-in-motion button:focus-visible {
        outline: 3px solid var(--em-accent);
        outline-offset: 3px;
      }
      #system-in-motion h2,
      #system-in-motion h3,
      #system-in-motion p {
        margin: 0;
      }
      #system-in-motion h2 {
        font-size: 26px;
        font-weight: 500;
        line-height: 1.2;
        letter-spacing: -0.7px;
      }
      #system-in-motion h3 {
        font-size: 18px;
        font-weight: 500;
        line-height: 1.3;
      }
      #system-in-motion strong {
        font-weight: 500;
      }
      #system-in-motion .em-muted {
        color: var(--em-muted);
      }
      #system-in-motion .em-small {
        font-size: 12px;
      }
      #system-in-motion .em-mono {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 12px;
      }
      #system-in-motion .em-top {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 24px;
        padding: 4px 100px 20px 0;
      }
      #system-in-motion [hidden] {
        display: none !important;
      }
      #system-in-motion .em-top-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-left: auto;
      }
      #system-in-motion .em-live {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--em-muted);
        font-size: 12px;
      }
      #system-in-motion .em-live::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--em-good);
      }
      #system-in-motion[data-paused='true'] .em-live::before {
        background: var(--em-accent);
      }
      #system-in-motion .em-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 500;
        font-size: 19px;
      }
      #system-in-motion .em-monogram {
        width: 34px;
        height: 34px;
        background: var(--em-action);
        color: var(--em-action-ink);
        display: grid;
        place-items: center;
        border-bottom: 3px solid var(--em-accent);
        font-size: 12px;
      }
      #system-in-motion .em-label {
        color: var(--em-muted);
        font-size: 12px;
      }
      #system-in-motion .em-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        padding-bottom: 20px;
      }
      #system-in-motion .em-heading p {
        margin-top: 9px;
        max-width: 650px;
        color: var(--em-muted);
      }
      #system-in-motion .em-count {
        white-space: nowrap;
        padding-top: 5px;
        font-variant-numeric: tabular-nums;
        color: var(--em-muted);
      }
      #system-in-motion .em-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 242px;
        gap: 16px;
      }
      #system-in-motion .em-window {
        background: var(--em-page);
        border: 1px solid var(--em-line);
        border-radius: 10px;
        overflow: hidden;
        min-width: 0;
      }
      #system-in-motion .em-windowbar {
        background: var(--em-panel);
        border-bottom: 1px solid var(--em-line);
        padding: 13px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      #system-in-motion .em-windowbar .em-brand {
        font-size: 14px;
      }
      #system-in-motion .em-person {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: var(--em-muted);
      }
      #system-in-motion .em-avatar {
        width: 25px;
        height: 25px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--em-soft);
        color: var(--em-ink);
        font-size: 11px;
        flex-shrink: 0;
      }
      #system-in-motion .em-appnav {
        display: flex;
        gap: 20px;
        padding: 0 18px;
        background: var(--em-panel);
        border-bottom: 1px solid var(--em-line);
        font-size: 12px;
      }
      #system-in-motion .em-appnav span {
        padding: 10px 0;
        border-bottom: 2px solid transparent;
        color: var(--em-muted);
      }
      #system-in-motion .em-appnav span[aria-current='page'] {
        border-color: var(--em-accent);
        color: var(--em-ink);
      }
      #system-in-motion .em-stage {
        min-height: 378px;
        padding: 22px;
        position: relative;
        overflow: hidden;
      }
      #system-in-motion .em-scene {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      #system-in-motion .em-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }
      #system-in-motion .em-stack {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
      }
      #system-in-motion .em-box {
        background: var(--em-panel);
        border: 1px solid var(--em-line);
        border-radius: 7px;
        padding: 16px;
        min-width: 0;
      }
      #system-in-motion .em-box p + p {
        margin-top: 10px;
      }
      #system-in-motion .em-title {
        font-size: 17px;
        font-weight: 500;
      }
      #system-in-motion .em-status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 4px;
        padding: 3px 8px;
        background: var(--em-soft);
        font-size: 11px;
      }
      #system-in-motion .em-status.good {
        color: var(--em-good);
        background: var(--em-good-bg);
      }
      #system-in-motion .em-status.gold {
        color: var(--em-accent-ink);
        background: var(--em-accent-soft);
      }
      #system-in-motion .em-primary,
      #system-in-motion .em-secondary {
        min-height: 40px;
        padding: 8px 15px;
        border-radius: 5px;
        border: 1px solid transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        white-space: nowrap;
      }
      #system-in-motion .em-primary {
        background: var(--em-action);
        color: var(--em-action-ink);
      }
      #system-in-motion .em-secondary {
        color: var(--em-ink);
        background: var(--em-panel);
        border-color: var(--em-line);
      }
      #system-in-motion .em-primary:hover {
        filter: brightness(1.12);
      }
      #system-in-motion .em-secondary:hover {
        background: var(--em-soft);
      }
      #system-in-motion .em-mail-meta {
        display: grid;
        grid-template-columns: minmax(42px, max-content) minmax(0, 1fr);
        gap: 5px 10px;
        margin: 0 0 16px;
        font-size: 12px;
      }
      #system-in-motion .em-mail-meta dt {
        color: var(--em-muted);
      }
      #system-in-motion .em-mail-meta dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      #system-in-motion .em-mailbody {
        font-size: 14px;
        line-height: 1.8;
      }
      #system-in-motion mark {
        color: var(--em-ink);
        background: var(--em-accent-soft);
        padding: 1px 3px;
        border-radius: 2px;
      }
      #system-in-motion .em-split {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 14px;
      }
      #system-in-motion .em-fact {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 8px 0;
        border-bottom: 1px solid var(--em-line);
      }
      #system-in-motion .em-fact:last-child {
        border: 0;
      }
      #system-in-motion .em-fact span:first-child {
        font-size: 11px;
        color: var(--em-muted);
      }
      #system-in-motion .em-fact em {
        color: var(--em-muted);
        font-size: 11px;
        font-style: normal;
      }
      #system-in-motion .em-notice {
        padding: 10px 13px;
        background: var(--em-accent-soft);
        color: var(--em-accent-ink);
        border-left: 3px solid var(--em-accent);
        font-size: 12px;
      }
      #system-in-motion .em-inboxitem {
        border-left: 3px solid var(--em-accent);
      }
      #system-in-motion .em-sourceline {
        height: 5px;
        width: 84%;
        background: var(--em-soft);
        border-radius: 2px;
      }
      #system-in-motion .em-sourceline.short {
        width: 58%;
      }
      #system-in-motion .em-path {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 16px 0;
      }
      #system-in-motion .em-path-node {
        flex: 1;
        min-width: 0;
        text-align: center;
        padding: 16px 8px;
        border: 1px solid var(--em-line);
        border-radius: 6px;
        background: var(--em-panel);
        font-size: 12px;
      }
      #system-in-motion .em-path-node b {
        display: block;
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 6px;
        color: var(--em-accent-ink);
      }
      #system-in-motion .em-conveyor {
        position: relative;
        height: 46px;
        margin: 0 5%;
        border-bottom: 1px solid var(--em-line);
      }
      #system-in-motion .em-envelope {
        position: absolute;
        top: 2px;
        left: 0;
        width: 62px;
        height: 31px;
        border: 1px solid var(--em-accent);
        border-radius: 4px;
        display: grid;
        place-items: center;
        background: var(--em-accent-soft);
        color: var(--em-accent-ink);
        font-size: 10px;
        letter-spacing: 0.5px;
      }
      #system-in-motion .em-ledger {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      #system-in-motion .em-ledger th {
        text-align: left;
        color: var(--em-muted);
        font-weight: 400;
        padding: 0 0 10px;
      }
      #system-in-motion .em-ledger td {
        padding: 10px 0;
        border-top: 1px solid var(--em-line);
        vertical-align: top;
      }
      #system-in-motion .em-ledger th:last-child,
      #system-in-motion .em-ledger td:last-child {
        text-align: right;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      #system-in-motion .em-total {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid var(--em-line);
        padding-top: 14px;
        font-size: 17px;
      }
      #system-in-motion .em-tabs {
        display: flex;
        gap: 16px;
        font-size: 12px;
        color: var(--em-muted);
      }
      #system-in-motion .em-tabs .selected {
        color: var(--em-ink);
        border-bottom: 2px solid var(--em-accent);
        padding-bottom: 5px;
      }
      #system-in-motion .em-check {
        display: flex;
        gap: 9px;
        align-items: flex-start;
        padding: 7px 0;
        font-size: 12px;
      }
      #system-in-motion .em-check b {
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        background: var(--em-good-bg);
        color: var(--em-good);
        border-radius: 50%;
        font-size: 11px;
        font-weight: 500;
      }
      #system-in-motion .em-document {
        border-top: 4px solid var(--em-accent);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #system-in-motion .em-document h3 {
        letter-spacing: 1px;
      }
      #system-in-motion .em-document .em-ledger {
        font-size: 11px;
      }
      #system-in-motion .em-timeline {
        display: flex;
        flex-direction: column;
        gap: 0;
        list-style: none;
        padding: 0;
        margin: 0;
      }
      #system-in-motion .em-timeline li {
        position: relative;
        border-left: 1px solid var(--em-line);
        padding: 0 0 15px 18px;
        font-size: 12px;
      }
      #system-in-motion .em-timeline li::before {
        content: '';
        position: absolute;
        top: 5px;
        left: -4px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--em-accent);
      }
      #system-in-motion .em-timeline li:last-child {
        padding-bottom: 0;
      }
      #system-in-motion .em-timeline time {
        display: block;
        color: var(--em-muted);
        font-size: 11px;
      }
      #system-in-motion .em-engine {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 14px 0 0 4px;
        min-width: 0;
      }
      #system-in-motion .em-enginehead {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #system-in-motion .em-enginehead::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--em-accent);
      }
      #system-in-motion .em-engine-title {
        font-size: 12px;
        font-weight: 500;
      }
      #system-in-motion .em-service {
        padding: 0 0 16px 20px;
        margin-left: 3px;
        position: relative;
        border-left: 1px solid var(--em-line);
      }
      #system-in-motion .em-service:last-child {
        border: 0;
        padding-bottom: 0;
      }
      #system-in-motion .em-service::before {
        content: '';
        position: absolute;
        left: -4px;
        top: 7px;
        width: 7px;
        height: 7px;
        background: var(--em-line);
        border-radius: 50%;
      }
      #system-in-motion .em-service.active::before {
        background: var(--em-accent);
        box-shadow: 0 0 0 4px var(--em-accent-soft);
      }
      #system-in-motion .em-service.active .em-service-name {
        color: var(--em-ink);
      }
      #system-in-motion .em-service-name {
        font-size: 12px;
        color: var(--em-muted);
        font-weight: 500;
      }
      #system-in-motion .em-service-detail {
        font-size: 11px;
        color: var(--em-muted);
        padding-top: 4px;
        overflow-wrap: anywhere;
      }
      #system-in-motion .em-record {
        margin-top: auto;
        padding-top: 14px;
        border-top: 1px solid var(--em-line);
      }
      #system-in-motion .em-record strong {
        display: block;
        padding: 5px 0;
      }
      #system-in-motion .em-controls {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        padding: 18px 0 15px;
      }
      #system-in-motion .em-controls .em-control-note {
        margin-left: auto;
        font-size: 12px;
        color: var(--em-muted);
      }
      #system-in-motion .em-steps {
        display: grid;
        grid-template-columns: repeat(9, minmax(0, 1fr));
        gap: 5px;
      }
      #system-in-motion .em-step {
        min-width: 0;
        padding: 10px 4px;
        border: 0;
        border-top: 3px solid var(--em-line);
        background: transparent;
        color: var(--em-muted);
        text-align: left;
        font-size: 11px;
      }
      #system-in-motion .em-step strong {
        display: block;
        font-size: 11px;
        margin-bottom: 5px;
        font-variant-numeric: tabular-nums;
      }
      #system-in-motion .em-step[aria-current='step'] {
        border-color: var(--em-accent);
        color: var(--em-ink);
        background: var(--em-accent-soft);
      }
      #system-in-motion .em-step.done {
        border-color: var(--em-muted);
      }
      #system-in-motion .em-foot {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        padding-top: 12px;
        font-size: 11px;
        color: var(--em-muted);
      }
      #system-in-motion .em-auto-action {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        padding: 11px 14px;
        background: var(--em-good-bg);
        color: var(--em-good);
        border-radius: 5px;
        font-size: 12px;
      }
      #system-in-motion .em-flow-current {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 18px;
        margin-bottom: 18px;
        font-size: 12px;
      }
      #system-in-motion .em-flow-current strong {
        color: var(--em-accent-ink);
      }
      #system-in-motion .em-map {
        position: relative;
        min-width: 0;
        display: grid;
        grid-template-columns: 1.12fr repeat(5, minmax(0, 1fr));
        gap: 22px 24px;
        padding: 52px 14px 28px;
        background: var(--em-panel);
      }
      #system-in-motion .em-cloud-frame {
        position: absolute;
        z-index: 0;
        inset: 0 0 0 calc((100% - 148px) / 6 + 32px);
        border: 1px solid var(--em-ink);
      }
      #system-in-motion .em-cloud-label {
        position: absolute;
        z-index: 2;
        top: 10px;
        left: calc((100% - 148px) / 6 + 46px);
        display: flex;
        align-items: center;
        gap: 9px;
        background: var(--em-panel);
        padding-right: 8px;
        font-size: 12px;
      }
      #system-in-motion .em-cloud-label img {
        width: 28px;
        height: 28px;
      }
      #system-in-motion .em-flow-group {
        display: contents;
      }
      #system-in-motion .em-flow-title {
        position: relative;
        z-index: 2;
        grid-column: 2 / 7;
        grid-row: var(--row);
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        align-items: baseline;
        padding: 3px 0;
        font-size: 12px;
      }
      #system-in-motion .em-flow-title strong {
        font-weight: 500;
      }
      #system-in-motion .em-flow-title small {
        color: var(--em-muted);
        font-size: 11px;
      }
      #system-in-motion .em-flow-title[data-current='true'] strong {
        color: var(--em-accent-ink);
      }
      #system-in-motion .em-map-node {
        position: relative;
        z-index: 2;
        grid-column: var(--col);
        grid-row: var(--row);
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 7px;
        min-width: 0;
        padding: 3px;
        text-align: center;
        align-self: start;
      }
      #system-in-motion .em-map-node strong,
      #system-in-motion .em-map-node small,
      #system-in-motion .em-flow-title strong,
      #system-in-motion .em-flow-title small {
        background: var(--em-panel);
      }
      #system-in-motion .em-map-node strong {
        display: block;
        font-size: 12px;
        line-height: 1.35;
        overflow-wrap: anywhere;
        font-weight: 500;
      }
      #system-in-motion .em-map-node small {
        font-size: 11px;
        line-height: 1.4;
        color: var(--em-muted);
        overflow-wrap: anywhere;
      }
      #system-in-motion .em-diagram-symbol {
        position: relative;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        flex-shrink: 0;
        background: var(--em-panel);
      }
      #system-in-motion .em-diagram-symbol img {
        display: block;
        width: 44px;
        height: 44px;
      }
      #system-in-motion .em-diagram-symbol svg {
        width: 36px !important;
        height: 36px !important;
        stroke-width: 1.4;
      }
      #system-in-motion .em-map-node[data-state='active'] .em-diagram-symbol {
        outline: 2px solid var(--em-accent);
        outline-offset: 5px;
      }
      #system-in-motion .em-map-node[data-state='active'] strong {
        color: var(--em-accent-ink);
      }
      #system-in-motion .em-step-badge {
        position: absolute;
        display: grid;
        place-items: center;
        top: -10px;
        left: -26px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--em-action);
        color: var(--em-action-ink);
        font-size: 11px;
      }
      #system-in-motion .em-step-badge[aria-current='step'] {
        background: var(--em-accent);
        color: #ffffff;
      }
      #system-in-motion .em-map-node [data-node-status] {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;

          }
          $('scene-number').textContent =
            String(index + 1).padStart(2, '0') +
            ' / ' +
            String(model.scenes.length).padStart(2, '0');
          $('surface-label').textContent =
            exp.mode === 'explanation' ? 'System processing / ' + exp.surface : exp.surface;
          $('actor').textContent = exp.actor;
          $('avatar').textContent = exp.actor
            .split(' ')
            .map((s) => s[0])
            .slice(0, 2)
            .join('');
          $('surface-state').textContent = exp.state;
          $('navigation').hidden = exp.layout === 'terminal';
          $('trigger').textContent = scene.trigger;
          $('flow-name').textContent = scene.title;
          $('flow-trigger').textContent = scene.trigger;
          $('scene-status').textContent = scene.status + (scene.note ? ' / ' + scene.note : '');
          for (const nav of $('navigation').children) {
            if (nav.textContent === (exp.nav || navigation[0]))
              nav.setAttribute('aria-current', 'page');
            else nav.removeAttribute('aria-current');
          }
          sceneSurface(scene);
          $('behind').replaceChildren();
          for (const work of scene.behind) {
            const component = components.get(work.component),
              row = create('div', 'em-service active');
            row.append(
              create('div', 'em-service-name', component.label),
              create('div', 'em-service-detail', business
                ? model.lanes.find((lane) => lane.id === component.lane).label + ' / ' + work.action
                : component.technology + ' / ' + work.action),
            );
            $('behind').append(row);
          }
          const previousComponents = new Set(
              model.scenes.slice(0, index).flatMap((s) => s.activeComponents),
            ),
            previousEdges = new Set(model.scenes.slice(0, index).flatMap((s) => s.activeEdges));
          for (const [id, node] of nodeElements) {
            node.dataset.state = scene.activeComponents.includes(id)
              ? 'active'
              : previousComponents.has(id)
                ? 'visited'
                : 'future';
            for (const step of node.querySelectorAll('[data-step]')) {
              if (Number(step.dataset.step) === index + 1)
                step.setAttribute('aria-current', 'step');
              else step.removeAttribute('aria-current');
            }
          }
          for (const edge of model.edges)
            if (edgeElements.has(edge.id))
              edgeElements.get(edge.id).dataset.state = scene.activeEdges.includes(edge.id)
                ? 'active'
                : previousEdges.has(edge.id)
                  ? 'visited'
                  : 'future';
          for (const button of $('steps').children) {
            const i = Number(button.dataset.scene);
            button.classList.toggle('done', i < index);
            if (i === index) button.setAttribute('aria-current', 'step');
            else button.removeAttribute('aria-current');
          }
          $('exchange-trace').textContent =
            scene.activeEdges
              .map((id) => {
                const e = model.edges.find((e) => e.id === id);
                return (
                  components.get(e.from).label +
                  ' → ' +
                  components.get(e.to).label +
                  ' / ' +
                  e.label +
                  ' (' +
                  e.kind +
                  ')'
                );
              })
              .join(' · ') || 'No exchange asserted in this moment.';
          updateClock();
          updatePackets();
        }
        function setText(id, value) {
          if ($(id).textContent !== value) $(id).textContent = value;
        }
        function updateClock() {
          const spent = model.scenes.slice(0, index).reduce((n, s) => n + s.duration, 0) + elapsed;
          $('progress').style.width = (spent / total) * 100 + '%';
          $('progress').parentElement.setAttribute(
            'aria-valuenow',
            Math.round((spent / total) * 100),
          );
          setText('clock', complete
            ? 'Journey complete / Replay to watch again'
            : playing
              ? 'Automatic demo / time compressed'
              : 'Paused / motion and playback held');
          setText('autostatus', complete
            ? 'Complete'
            : playing
              ? 'Automatic demo'
              : 'Paused');
          setText('play', playing ? 'Pause' : complete ? 'Complete' : 'Resume');
          $('play').disabled = complete;
          $('back').disabled = index === 0;
          $('next').disabled = index === model.scenes.length - 1;
          $('system-in-motion').dataset.paused = String(!playing);
          document.body.dataset.scene = index;
          document.body.dataset.elapsed = elapsed;
          document.body.dataset.playing = playing;
          document.body.dataset.complete = complete;
        }
        function go(next) {
          index = Math.max(0, Math.min(model.scenes.length - 1, next));
          elapsed = 0;
          complete = false;
          revealAll = !playing;
          previousTime = performance.now();
          renderScene();
        }
        $('play').onclick = () => {
          playing = !playing;
          if (!playing) revealAll = true;
          previousTime = performance.now();
          updateClock();
          updatePackets();
        };
        $('back').onclick = () => go(index - 1);
        $('next').onclick = () => go(index + 1);
        $('replay').onclick = () => {
          playing = true;
          go(0);
        };
        let toggle = $(business ? 'experience-tab' : 'architecture-tab');
        toggle.onclick = () => {
          view = view === 'experience' ? 'architecture' : 'experience';
          $('experience').hidden = view !== 'experience';
          $('architecture').hidden = view !== 'architecture';
          toggle.id = view === 'experience' ? 'architecture-tab' : 'experience-tab';
          toggle.textContent = view === 'experience' ? (business ? 'Business map' : 'Architecture') : 'Experience';
          toggle.setAttribute(
            'aria-controls',
            view === 'architecture' ? 'experience' : 'architecture',
          );
          if (view === 'architecture') scheduleDraw();
          // Graph measurement can rebuild the experience while it has no width.
          // Recompute its shared-clock pose after reveal, including while paused.
          else updatePackets();
        };
        const rectRelative = (element, base) => {
          const r = element.getBoundingClientRect();
          return {
            left: r.left - base.left,
            top: r.top - base.top,
            right: r.right - base.left,
            bottom: r.bottom - base.top,
          };
        };
        const contains = (r, p) =>
          p.x > r.left + 0.01 &&
          p.x < r.right - 0.01 &&
          p.y > r.top + 0.01 &&
          p.y < r.bottom - 0.01;
        function intersects(a, b, r) {
          if (Math.abs(a.x - b.x) < 0.01)
            return (
              a.x > r.left + 0.01 &&
              a.x < r.right - 0.01 &&
              Math.max(a.y, b.y) > r.top + 0.01 &&
              Math.min(a.y, b.y) < r.bottom - 0.01
            );
          return (
            a.y > r.top + 0.01 &&
            a.y < r.bottom - 0.01 &&
            Math.max(a.x, b.x) > r.left + 0.01 &&
            Math.min(a.x, b.x) < r.right - 0.01
          );
        }
        // Routing uses measured caption/card bounds. Grid corridors stay outside every
        // inflated card and heading; endpoint stubs alone meet their own card boundary.
        function buildRoutingGrid(bounds, obstacles, ports) {
          const xs = [8, bounds.width - 8],
            ys = [8, bounds.height - 8];
          for (const r of obstacles) {
            xs.push(r.left, r.right);
            ys.push(r.top, r.bottom);
          }
          for (const group of ports.values())
            for (const p of group) {
              xs.push(p.lead.x);
              ys.push(p.lead.y);
            }
          const unique = (values) =>
            [...new Set(values.map((n) => Math.round(n * 100) / 100))].sort((a, b) => a - b);
          const x = unique(xs),
            y = unique(ys),
            nodes = new Array(x.length * y.length),
            lookup = new Map();
          for (let j = 0; j < y.length; j++)
            for (let i = 0; i < x.length; i++) {
              const p = { x: x[i], y: y[j] };
              if (obstacles.some((r) => contains(r, p))) continue;
              const id = j * x.length + i;
              nodes[id] = { ...p, links: [] };
              lookup.set(`${p.x},${p.y}`, id);
            }
          for (let j = 0; j < y.length; j++)
            for (let i = 0; i < x.length; i++) {
              const id = j * x.length + i,
                a = nodes[id];
              if (!a) continue;
              for (const other of [
                i + 1 < x.length ? id + 1 : -1,
                j + 1 < y.length ? id + x.length : -1,
              ]) {
                const b = nodes[other];
                if (!b || obstacles.some((r) => intersects(a, b, r))) continue;
                const direction = Math.abs(a.x - b.x) < 0.01 ? 1 : 0,
                  distance = Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
                a.links.push({ id: other, direction, distance });
                b.links.push({ id, direction, distance });
              }
            }
          return { nodes, lookup };
        }
        class MinHeap {
          constructor() {
            this.items = [];
          }
          push(value) {
            const a = this.items;
            a.push(value);
            let i = a.length - 1;
            while (i) {
              const parent = (i - 1) >> 1;
              if (a[parent].cost <= value.cost) break;
              a[i] = a[parent];
              i = parent;
            }
            a[i] = value;
          }
          pop() {
            const a = this.items,
              first = a[0],
              last = a.pop();
            if (a.length) {
              let i = 0;
              while (i * 2 + 1 < a.length) {
                let child = i * 2 + 1;
                if (child + 1 < a.length && a[child + 1].cost < a[child].cost) child++;
                if (a[child].cost >= last.cost) break;
                a[i] = a[child];
                i = child;
              }
              a[i] = last;
            }
            return first;
          }
          get length() {
            return this.items.length;
          }
        }
        function routeEdge(edge, grid, ports, obstacles) {
          const key = (p) => `${Math.round(p.x * 100) / 100},${Math.round(p.y * 100) / 100}`;
          const starts = ports
              .get(`${edge.id}:from`)
              .filter((p) => !obstacles.some((r) => contains(r, p.lead))),
            ends = ports
              .get(`${edge.id}:to`)
              .filter((p) => !obstacles.some((r) => contains(r, p.lead)));
          const endByNode = new Map(ends.map((p) => [grid.lookup.get(key(p.lead)), p]));
          const distance = new Map(),
            previous = new Map(),
            origins = new Map(),
            heap = new MinHeap();
          for (const p of starts) {
            const id = grid.lookup.get(key(p.lead));
            if (id === undefined) continue;
            const state = id * 2 + p.direction;
            distance.set(state, 10);
            origins.set(state, p);
            heap.push({ state, cost: 10 });
          }
          let final;
          while (heap.length) {
            const current = heap.pop();
            if (final && current.cost >= final.cost) break;
            if (distance.get(current.state) !== current.cost) continue;
            const id = Math.floor(current.state / 2),
              direction = current.state % 2;
            if (endByNode.has(id)) {
              const port = endByNode.get(id),
                cost = current.cost + 10 + (direction === port.direction ? 0 : 18);
              if (!final || cost < final.cost) final = { state: current.state, port, cost };
            }
            for (const link of grid.nodes[id].links) {
              const state = link.id * 2 + link.direction,
                cost = current.cost + link.distance + (direction === link.direction ? 0 : 18);
              if (cost >= (distance.get(state) ?? Infinity)) continue;
              distance.set(state, cost);
              previous.set(state, current.state);
              origins.set(state, origins.get(current.state));
              heap.push({ state, cost });
            }
          }
          if (!final) return null;
          const points = [final.port.dock];
          let state = final.state;
          while (state !== undefined) {
            const node = grid.nodes[Math.floor(state / 2)];
            points.push({ x: node.x, y: node.y });
            state = previous.get(state);
          }
          points.push(origins.get(final.state).dock);
          points.reverse();
          // Quantize endpoints to the grid before simplifying. A loose collinearity
          // tolerance can erase two adjacent corners into a diagonal on fractional
          // browser geometry, so only exactly aligned runs are collapsed.
          const simplified = [];
          for (const point of points) {
            const p = { x: Math.round(point.x * 100) / 100, y: Math.round(point.y * 100) / 100 };
            const last = simplified.at(-1);
            if (last && last.x === p.x && last.y === p.y) continue;
            while (simplified.length > 1) {
              const a = simplified.at(-2),
                b = simplified.at(-1);
              if ((a.x === b.x && b.x === p.x) || (a.y === b.y && b.y === p.y)) simplified.pop();
              else break;
            }
            simplified.push(p);
          }
          return simplified;
        }
        function svgElement(name, attrs = {}, text) {
          const element = document.createElementNS('http://www.w3.org/2000/svg', name);
          for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, value);
          if (text !== undefined) element.textContent = text;
          return element;
        }
        function draw() {
          redrawPending = false;
          if (view !== 'architecture') return;
          if (business) {
            $('diagram').dataset.geometryReady = 'true';
            $('diagram').dataset.routeCount = routes.length;
            $('diagram').dataset.routeErrors = '0';
            return;
          }
          const diagram = $('diagram'),
            base = diagram.getBoundingClientRect();
          if (!base.width) return;
          const geometry = new Map(
            [...nodeElements].map(([id, node]) => [
              id,
              {
                icon: rectRelative(node.querySelector('svg'), base),
                caption: rectRelative(node.querySelector('.em-node-caption'), base),
              },
            ]),
          );
          // A lane heading spans the grid, but only its text occupies routing
          // space. Measure each rendered text line, including wrapped captions.
          const headers = [...diagram.querySelectorAll('.lane-heading > *')]
            .flatMap((element) => {
              const range = document.createRange();
              range.selectNodeContents(element);
              return [...range.getClientRects()]
                .filter((r) => r.width && r.height)
                .map((r) => ({
                  left: r.left - base.left,
                  top: r.top - base.top,
                  right: r.right - base.left,
                  bottom: r.bottom - base.top,
                }));
            })
            .concat(
              [...diagram.querySelectorAll('.em-cloud-label')].map((e) => rectRelative(e, base)),
            );
          const obstacles = [...geometry.values()]
            .flatMap((g) => [g.icon, g.caption])
            .concat(headers)
            .map((r) => ({
              left: r.left - 7,
              top: r.top - 7,
              right: r.right + 7,
              bottom: r.bottom + 7,
            }));
          const ports = new Map();
          for (const edge of model.edges)
            for (const side of ['from', 'to']) {
              const id = edge[side],
                g = geometry.get(id),
                r = g.icon,
                c = g.caption,
                incident = model.edges.filter((e) => e.from === id || e.to === id),
                fraction =
                  (incident.findIndex((e) => e.id === edge.id) + 1) / (incident.length + 1),
                cx = r.left + (r.right - r.left) * fraction,
                cy = r.top + (r.bottom - r.top) * fraction;
              ports.set(`${edge.id}:${side}`, [
                { dock: { x: cx, y: r.top }, lead: { x: cx, y: r.top - 10 }, direction: 1 },
                { dock: { x: r.right, y: cy }, lead: { x: r.right + 10, y: cy }, direction: 0 },
                {
                  dock: { x: (c.left + c.right) / 2, y: c.bottom },
                  lead: { x: (c.left + c.right) / 2, y: c.bottom + 10 },
                  direction: 1,
                },
                { dock: { x: r.left, y: cy }, lead: { x: r.left - 10, y: cy }, direction: 0 },
              ]);
            }
          const grid = buildRoutingGrid(base, obstacles, ports),
            svg = $('connectors');
          svg.replaceChildren();
          svg.setAttribute('viewBox', `0 0 ${base.width} ${base.height}`);
          const defs = svgElement('defs', {});
          for (const [id, color] of [
            ['arrow', 'var(--em-wire)'],
            ['arrow-active', 'var(--em-accent-ink)'],
          ]) {
            const marker = svgElement('marker', {
              id,
              viewBox: '0 0 10 10',
              refX: 9,
              refY: 5,
              markerWidth: 7,
              markerHeight: 7,
              orient: 'auto',
              markerUnits: 'userSpaceOnUse',
            });
            marker.append(svgElement('path', { d: 'M 0 1 L 9 5 L 0 9 z', fill: color }));
            defs.append(marker);
          }
          svg.append(defs);
          routes = [];
          routeErrors = [];
          edgeElements.clear();
          for (const edge of model.edges) {
            const points = routeEdge(edge, grid, ports, obstacles);
            if (!points) {
              routeErrors.push(edge.id);
              continue;
            }
            const path = svgElement('path', {
              class: 'edge',
              d: points.map((p, i) => `${i ? 'L' : 'M'} ${p.x} ${p.y}`).join(' '),
              'data-edge': edge.id,
              'data-kind': edge.kind,
              'data-status': edge.status,
            });
            const title = svgElement('title', {});
            title.textContent = edge.label + ' / ' + edge.kind;
            path.append(title);
            svg.append(path);
            const packet = svgElement('circle', { class: 'packet', r: 3 });
            svg.append(packet);
            edgeElements.set(edge.id, path);
            routes.push({ edge, path, packet, points });
          }
          $('route-error').hidden = !routeErrors.length;
          $('route-error').textContent =
            'Layout needs revision: no clear route for ' +
            routeErrors.join(', ') +
            '. These exchanges remain in the model; diagram verification is incomplete.';
          diagram.dataset.geometryReady = 'true';
          diagram.dataset.routeCount = routes.length;
          diagram.dataset.routeErrors = routeErrors.length;
          renderScene();
        }
        function scheduleDraw() {
          if (!redrawPending) {
            redrawPending = true;
            $('diagram').dataset.geometryReady = 'false';
            requestAnimationFrame(draw);
          }
        }
        function currentPhase() {
          const scene = model.scenes[index];
          return Math.min((scene.phases?.length || 1) - 1,
            Math.floor(elapsed / (scene.duration / (scene.phases?.length || 1))));
        }
        function updatePackets() {
          for (const { element, type, order } of motion) {
            const t = reduced.matches || revealAll || !playing
              ? 1
              : Math.max(0, Math.min(1, (elapsed - order * 0.3) / 0.65));
            element.style.opacity = type === 'travel' ? '1' : String(0.2 + 0.8 * t);
            if (type === 'travel') {
              const width = element.parentElement.clientWidth - element.offsetWidth;
              const fraction = reduced.matches
                ? 1
                : Math.min(1, elapsed / Math.max(1, model.scenes[index].duration * 0.75));
              element.style.transform = `translateX(${Math.max(0, width) * fraction}px)`;
            } else if (type === 'arrival')
              element.style.transform = `translate(${(1 - t) * 75}px,${(1 - t) * -22}px) rotate(${(1 - t) * 3}deg)`;
            else if (type === 'document') element.style.transform = `translateY(${(1 - t) * 18}px)`;
            else element.style.transform = `translateX(${(1 - t) * 13}px)`;
          }
          const scene = model.scenes[index], phase = currentPhase();
          for (const route of routes) {
            const active = scene.activeEdges.includes(route.edge.id);
            const inPhase = !scene.phases || scene.phases[phase].edges.includes(route.edge.id);
            const travels = active && inPhase && !complete && !reduced.matches &&
              !['observe', 'prerequisite'].includes(route.edge.kind);
            route.packet.dataset.phaseActive = String(inPhase);
            route.path.setAttribute(
              'marker-end',
              route.edge.kind === 'observe' ? 'none' : `url(#${active ? 'arrow-active' : 'arrow'})`,
            );
            route.packet.style.display =
              travels ? '' : 'none';
            if (travels) {
              const phaseDuration = scene.duration / (scene.phases?.length || 1);
              const fraction = scene.phases
                ? Math.min(1, Math.max(0, (elapsed - phase * phaseDuration) / phaseDuration))
                : (elapsed / 2.8) % 1;
              const p = route.path.getPointAtLength(route.path.getTotalLength() * fraction);
              route.packet.setAttribute('cx', p.x);
              route.packet.setAttribute('cy', p.y);
            }
          }
        }
        function tick(now) {
          // A background tab can leave a long gap between animation frames.
          const delta = Math.min(0.25, Math.max(0, (now - previousTime) / 1000));
          previousTime = now;
          if (playing && !complete) {
            elapsed += delta;
            while (elapsed >= model.scenes[index].duration) {
              if (index === model.scenes.length - 1) {
                elapsed = model.scenes[index].duration;
                playing = false;
                complete = true;
                break;
              }
              elapsed -= model.scenes[index].duration;
              index++;
              renderScene();
            }
            updateClock();
            updatePackets();
          }
          requestAnimationFrame(tick);
        }
        window.addEventListener('resize', scheduleDraw);
        new ResizeObserver(() => {
          if (view === 'architecture') scheduleDraw();
        }).observe($('diagram'));
        reduced.addEventListener('change', updatePackets);
        window.systemInMotion = Object.freeze({
          getState: () => ({
            index,
            elapsed,
            playing,
            complete,
            view,
            total,
            activePhase: currentPhase(),
            routeErrors: [...routeErrors],
          }),
          getModel: () => JSON.parse(JSON.stringify(model)),
        });
        renderScene();
        if (business) scheduleDraw();
        requestAnimationFrame(tick);
      })();
    </script>
  </body>
